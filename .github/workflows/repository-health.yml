name: Reusable repository health

on:
  workflow_call:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Reject tracked secret files and merge markers
        shell: bash
        run: |
          set -euo pipefail
          tracked_secrets="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*private_key.*|.*secret_key.*|.*seed_phrase.*)$' || true)"
          if [ -n "$tracked_secrets" ]; then
            printf 'Potential secret files are tracked:\n%s\n' "$tracked_secrets"
            exit 1
          fi
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- .; then
            echo 'Merge conflict markers found.'
            exit 1
          fi

      - name: Validate tracked JSON and shell files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(git ls-files -z '*.json')
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: ${{ hashFiles('**/*.php', 'composer.json') != '' }}
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate tracked PHP and XML files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')
          while IFS= read -r -d '' file; do
            python3 -c 'import sys; import xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$file"
          done < <(git ls-files -z '*.xml')

      - name: Install and test Node.js project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
            npm audit --omit=dev --audit-level=high
          elif node -e 'const p=require("./package.json"); process.exit(Object.keys({...p.dependencies,...p.devDependencies,...p.optionalDependencies}).length ? 0 : 1)'; then
            npm install --ignore-scripts --no-package-lock
          fi
          npm test --if-present

      - name: Validate and test Composer project
        if: ${{ hashFiles('composer.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
            if php -r '$p=json_decode(file_get_contents("composer.lock"), true); exit(count($p["packages"] ?? []) + count($p["packages-dev"] ?? []) > 0 ? 0 : 1);'; then
              composer audit --locked
            fi
            if php -r '$p=json_decode(file_get_contents("composer.json"), true); exit(isset($p["scripts"]["test"]) ? 0 : 1);'; then
              composer test
            fi
          fi

      - name: Write maintenance summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## Daily repository health'
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Policy: no empty or timestamp-only commits'
          } >> "$GITHUB_STEP_SUMMARY"
