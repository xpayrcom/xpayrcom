name: Refresh profile repository catalog

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm test
      - run: npm run update-profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit meaningful catalog changes
        if: ${{ steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          git config user.name 'xpayr-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh repository catalog'
          git push

